<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="696"><rect width="1380" height="696" fill="#e9e7e5"/><g font-family="PingFang SC, sans-serif"><text x="20" y="32" font-size="22" fill="#333">实现前方案 · 只有已拥有物品进入位置</text><g transform="translate(16,56)"><rect width="326" height="620" rx="22" fill="#fff3f7"/><text x="18" y="38" font-size="20" fill="#382d35">位置</text><text x="18" y="72" font-size="13" fill="#bc5b80">甜美 · 浅色 · 仅统计已拥有</text><rect x="12" y="96" width="302" height="112" rx="15" fill="#fffdfd"/><rect x="24" y="113" width="3" height="18" fill="#bc5b80"/><text x="36" y="128" font-size="17" fill="#382d35">卧室</text><text x="24" y="160" font-size="13" fill="#756b70">2 条记录</text><text x="24" y="190" font-size="13" fill="#756b70">已付清主裙　已拥有头饰</text><rect x="12" y="224" width="302" height="112" rx="15" fill="#fffdfd"/><rect x="24" y="241" width="3" height="18" fill="#bc5b80"/><text x="36" y="256" font-size="17" fill="#382d35">未分配</text><text x="24" y="288" font-size="13" fill="#756b70">1 条记录</text><text x="24" y="318" font-size="13" fill="#756b70">已拥有衬衫</text><text x="18" y="572" font-size="12" fill="#756b70">数量、缩略图与明细采用同一拥有规则</text><text x="18" y="600" font-size="11" fill="#756b70">沿用原皮肤组件，不改原始账本和历史资料</text></g><g transform="translate(358,56)"><rect width="326" height="620" rx="22" fill="#fff3f7"/><text x="18" y="38" font-size="20" fill="#382d35">春日主裙</text><text x="18" y="72" font-size="13" fill="#bc5b80">甜美 · 浅色 · 已拥有</text><rect x="12" y="96" width="302" height="82" rx="15" fill="#fffdfd"/><rect x="24" y="113" width="3" height="18" fill="#bc5b80"/><text x="36" y="128" font-size="17" fill="#382d35">价格与付款</text><text x="24" y="160" font-size="13" fill="#756b70">订单已付清</text><rect x="12" y="194" width="302" height="112" rx="15" fill="#fffdfd"/><rect x="24" y="211" width="3" height="18" fill="#bc5b80"/><text x="36" y="226" font-size="17" fill="#382d35">基本信息</text><text x="24" y="258" font-size="13" fill="#756b70">品牌　花园洋装</text><text x="24" y="288" font-size="13" fill="#756b70">颜色　粉色　　尺码　M</text><rect x="12" y="322" width="302" height="82" rx="15" fill="#fffdfd"/><rect x="24" y="339" width="3" height="18" fill="#bc5b80"/><text x="36" y="354" font-size="17" fill="#382d35">存放位置</text><text x="24" y="386" font-size="13" fill="#756b70">卧室 → 衣柜 → 第一层</text><text x="18" y="572" font-size="12" fill="#756b70">已拥有物品正常展示与设置位置</text><text x="18" y="600" font-size="11" fill="#756b70">沿用原皮肤组件，不改原始账本和历史资料</text></g><g transform="translate(700,56)"><rect width="326" height="620" rx="22" fill="#fff3f7"/><text x="18" y="38" font-size="20" fill="#382d35">春日主裙</text><text x="18" y="72" font-size="13" fill="#bc5b80">甜美 · 浅色 · 待付尾款</text><rect x="12" y="96" width="302" height="82" rx="15" fill="#fffdfd"/><rect x="24" y="113" width="3" height="18" fill="#bc5b80"/><text x="36" y="128" font-size="17" fill="#382d35">价格与付款</text><text x="24" y="160" font-size="13" fill="#756b70">定金已付 · 尾款待付</text><rect x="12" y="194" width="302" height="112" rx="15" fill="#fffdfd"/><rect x="24" y="211" width="3" height="18" fill="#bc5b80"/><text x="36" y="226" font-size="17" fill="#382d35">基本信息</text><text x="24" y="258" font-size="13" fill="#756b70">品牌　花园洋装</text><text x="24" y="288" font-size="13" fill="#756b70">颜色　粉色　　尺码　M</text><text x="18" y="572" font-size="12" fill="#756b70">未付清时不显示位置及位置操作</text><text x="18" y="600" font-size="11" fill="#756b70">沿用原皮肤组件，不改原始账本和历史资料</text></g><g transform="translate(1042,56)"><rect width="326" height="620" rx="22" fill="#fff3f7"/><text x="18" y="38" font-size="20" fill="#382d35">编辑服饰</text><text x="18" y="72" font-size="13" fill="#bc5b80">甜美 · 浅色 · 待付尾款</text><rect x="12" y="96" width="302" height="112" rx="15" fill="#fffdfd"/><rect x="24" y="113" width="3" height="18" fill="#bc5b80"/><text x="36" y="128" font-size="17" fill="#382d35">基本资料</text><text x="24" y="160" font-size="13" fill="#756b70">名称　春日主裙</text><text x="24" y="190" font-size="13" fill="#756b70">类型　JSK</text><rect x="12" y="224" width="302" height="112" rx="15"