function art(kind='belt',opts={}){const prefix='asset'+(++artId)+'-';const svg=(kind==='person'?person(opts.worn):belt(kind==='source')).replace(/id="([^"]+)"/g,(_,id)=>'id="'+prefix+id+'"').replace(/url\(#([^)]*)\)/g,(_,id)=>'url(#'+prefix+id+')');return `<div class="art ${opts.cls||''}" ${opts.style?`style="${opts.style}"`:''}>${svg}${opts.trim?trim(opts.trim):''}</div>`}
function appTop(title){return `<div class="status"><span>9:41</span><span>●●●　▰</span></div><div class="top"><button class="back" data-go="detail" aria-label="返回">‹</button><strong>${title}</strong><button class="more" aria-label="更多操作" data-go="detail">⋯</button></div>`}
function foot(label,go,sub='',disabled=false){return `<div class="footer">${sub?`<p class="muted">${sub}</p>`:''}<button class="primary" data-go="${go}" ${disabled?'disabled':''}>${label}</button><div class="homebar"></div></div>`}
function section(title,body,action=''){return `<section class="section"><div class="section-title">${title}${action}</div>${body}</section>`}
function steps(n){return `<div class="step"><span class="${n===1?'active':''}">1 选图整理</span><i class="line"></i><span class="${n===2?'active':''}">2 核对素材</span><i class="line"></i><span class="${n===3?'active':''}">3 用于试衣</span></div>`}

if(p==='fuse'||p==='keyboard')return `${appTop('加配饰 · 实验')}<div class="scroll">${steps(3)}${section('保留这张穿搭',`<div class="row"><div class="thumb">${art('person')}</div><div class="grow"><b>午后庭院 · 已保存试衣图</b><p class="muted">作为本次人物与服装底图</p></div><button class="text-button" data-go="fuse">更换</button></div><label class="choice"><input type="checkbox" data-base ${board?'checked':''}><span>保留这张底图上的现有服装</span></label>`)}${section('本次新增 1 件',`<div class="row"><div class="thumb">${art('belt',{cls:'checker'})}</div><div class="grow"><b>双扣腰饰 · 示意</b><p class="muted">使用已确认的主视素材</p><span class="pill">穿戴位置 · 腰部</span></div></div>`)}${section('穿戴要求',`<p>只加这件腰饰，保留底图中的人物与原搭配。</p><label class="field">补充要求（可选）<textarea rows="2">腰饰贴合腰部，链条自然垂落</textarea></label>`)}<p class="notice">人物、原裙纹与其他区域仍可能被重画；这是穿搭效果预览。</p><p class="muted">首版建议先开放腰饰。完整换装仍从“虚拟试衣”选择基础服装。</p></div>${foot('生成一张试衣图','result','底图 1 张 + 单品素材 1 张 · 发送前确认费用',!board)}${p==='keyboard'?'<div class="keyboard"><p>腰饰　贴合　腰部</p><p>Q W E R T Y U I O P</p><p>A S D F G H J K L</p><p>Z X C V B N M</p><div class="space">空格　　　　　　　　　完成</div></div>':''}`;
if(p==='result')return `${appTop('试衣图')}<div class="scroll"><div class="row spread" style="margin-bottom:12px"><div><p class="kicker">已保存到试衣历史</p><h2>午后庭院 · 加腰饰</h2></div><span class="pill">AI 生成</span></div>${art('person',{cls:'portrait',worn:true})}<div class="mini-links" style="margin:6px 0 14px"><button class="text-button" data-view="worn">放大细节</button><button class="text-button" data-view="person">对比本次底图</button></div>${section('本次使用',`<div class="row"><div class="thumb">${art('belt',{cls:'checker'})}</div><div class="grow"><b>双扣腰饰 · 主视素材</b><p class="muted">底图：午后庭院<br>方式：在原穿搭上加配饰</p></div></div>`)}<p class="notice">请检查人物、腰饰结构与原裙纹。保存图片不会计为实际穿过。</p></div>${foot('继续加配饰','fuse','原底图与本次结果分别保留')}`;
if(p==='ready')return `${appTop('物品详情')}<div class="scroll">${art('source',{cls:'hero',trim:s})}<div class="title">双扣腰饰 · 示意</div><p class="muted" style="margin-bottom:16px">腰饰　·　已拥有</p>${section('试衣素材',`<div class="row"><div class="thumb">${art('belt',{cls:'checker'})}</div><div class="grow"><b>主视单品 · 已确认</b><p class="muted">AI 整理 · 10月20日</p></div><button class="text-button" data-view="belt">查看</button></div><button class="secondary" data-go="fuse" style="margin-top:12px">用这份素材试衣</button><div class="mini-links"><button class="text-button" data-go="prepare">重新整理</button><button class="text-button" data-go="empty">移除素材</button></div>`)}<p class="notice">移除前需确认。商品相册、已提交任务和试衣历史各自保留。</p></div>`;
if(p==='picker')return `${appTop('更换参考图片')}<div class="scroll">${section('本次使用',`<label class="choice"><input type="radio" name="reference" checked><span><b>已确认试衣素材</b><small>主视单品 · 仅本件可用</small></span></label>${art('belt',{cls:'checker product'})}`)}${section('原商品图片',`<label class="choice"><input type="radio" name="reference"><span><b>商品相册 · 第 2 张</b><small>保留原视角，也可直接用于完整换装</small></span></label>${art('source',{cls:'product'})}`)}<p class="muted">切换参考图不会重新生成，也不改变原相册顺序。</p></div>${foot('使用所选图片','fuse','本次只替换这件物品的参考图')}`;
if(p==='empty')return `${appTop('试衣素材')}<div class="scroll"><div class="state-body center"><div class="state-mark">＋</div><h2>还没有已确认素材</h2><p class="muted" style="margin:12px 12px 24px">从商品相册或详情图选择一张，整理后核对。</p>${art('source',{cls:'product',trim:s})}</div><p class="notice">单品展示图继续保留原用途；整理素材也不会自动更换封面。</p></div>${foot('选择图片并整理','prepare','只在主动提交生成时使用图像服务')}`;
if(p==='queued')return `${appTop('任务详情')}<div class="scroll">${section('正在整理试衣素材',`<div class="row"><span class="spinner"></span><b>等待图像服务返回</b></div><p class="muted" style="margin-top:8px">本次只生成单品素材，结果返回后需要核对。</p>`)}<div class="skeleton"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:48%"></div><p class="notice">可以离开此页。应用重启后不会自动重新发送付费请求。</p><button class="secondary" data-go="detail">返回衣橱继续使用</button><button class="text-button" style="width:100%;margin-top:10px" data-go="failed">停止等待</button><p class="muted">停止等待后，服务端仍可能处理或计费。</p></div><div class="task-strip"><span class="spinner"></span>正在整理 1 件试衣素材<button class="text-button" data-go="queued">查看</button></div><div class="navline"><b>首页</b><span>穿搭</span><span>统计</span><span>个人</span></div>`;
if(p==='failed')return `${appTop('任务详情')}<div class="scroll"><div class="state-body center"><div class="state-mark">!</div><h2>这次未得到透明单品</h2><p class="muted" style="margin:12px">返回图片含有背景，暂不能保存为可用素材。</p></div>${section('本次请求',`${cardSource()}<p class="notice">请求已经发送，服务可能已计费。不会自动重试。</p>`)}<p class="muted">查看详情可核对服务返回。更换输入或服务后，重新确认费用。</p><div class="mini-links"><button class="text-button" data-go="failed">查看失败详情</button><button class="text-button" data-go="detail">保留记录，稍后处理</button></div></div>${foot('核对后重新发起','prepare','重新发起是一次新的请求，不会立即发送')}`;
if(p==='missing')return `${appTop('核对试衣素材')}<div class="scroll">${art('belt',{cls:'checker product'})}<div class="state-body center"><div class="state-mark">!</div><h2>原物品已删除</h2><p class="muted" style="margin:12px">这份预览仍可查看，无法再保存到原物品。</p></div>${section('保留已完成的任务',`<p class="muted">不会自动新建物品或改绑到其他商品。舍弃预览后，仅清理没有其他引用的图片。</p>`)}<button class="secondary" disabled>确认并保存素材</button></div>${foot('返回任务中心','queued','稍后仍可查看记录，或主动舍弃预览')}`;
if(p==='fee')return `${appScreen('prepare',s,true)}<div class="modal-shade"><section class="modal" role="dialog" aria-label="确认生成素材"><h2>确认整理这件单品？</h2>${cardSource()}<div class="detail-line"><span>接收方</span><b>当前所选图像服务</b></div><div class="detail-line"><span>发送内容</span><b>所选图片 1 张与整理要求</b></div><div class="detail-line"><span>本次操作</span><b>1 次生成</b></div><p>API 按服务资费计费，应用不能预先确认金额。只生成单品素材；试衣融合需另行确认。</p><p class="muted">未选相册、订单、价格、位置与个人照片均不会发送。</p><button class="primary" data-go="queued">确认发送并生成</button><button class="secondary" data-go="prepare">返回修改</button></section></div>`;
return '';
}
function phone(p,s=skin,d=dark,board=false,extra=''){return `<article class="phone ${d?'dark':''} ${extra}" data-skin="${s}" data-page="${p}" aria-label="${names[s]}${d?'暗色':'浅色'}${p}设计稿">${appScreen(p,s,board)}</article>`}
const labels={detail:['从物品详情进入','新素材不混入商品相册'],prepare:['选择图片，整理主视单品','先看实际输入，再确认单次费用'],review:['对照原图，确认一件单品','保存后复用；重做需另行提交'],fuse:['在已保存穿搭上加配饰','明确底图与本次新增物品'],result:['结果进入现有试衣历史','核对细节，可继续加配饰'],ready:['已确认后回到物品详情','一份当前素材，查看、重做与移除'],picker:['完整换装的参考图选择','原商品图片与确认素材明确区分'],empty:['空状态','清楚呈现首次入口'],queued:['处理中与全局任务栏','显示真实阶段，离页后仍可查看'],failed:['服务返回不符合要求','未得到透明图，不冒充成功'],missing:['核对时物品已经删除','阻止改绑与新建，保留任务'],fee:['每次生成单独确认','整理和融合不隐式串行付费'],keyboard:['小屏、键盘与补充要求','底部操作随键盘上移']};
function plate(p,s,d,board=true,extra=''){return `<div class="plate"><p class="plate-caption">${labels[p][0]}<span>${labels[p][1]}</span></p>${phone(p,s,d,board,extra)}</div>`}
function render(){document.querySelector('#skin').value=skin;document.querySelector('#appearance').value=dark?'dark':'light';document.querySelector('#page').value=page;document.querySelector('#large').textContent=large?'标准字号':'大字预览';document.querySelector('#simulate').disabled=page!=='queued';let board=q.get('board'),html='';if(board){document.body.className='board '+board;if(board==='flow')html=['detail','prepare','review','fuse','result'].map(p=>plate(p,skin,dark)).join('');if(board==='skins'){document.querySelector('h1').textContent='七套皮肤 · 核对试衣素材 · '+(dark?'暗色':'浅色');html=Object.keys(names).map(s=>`<div class="plate"><p class="plate-caption">${names[s]}<span>${{default:'柔和曲线与缎带',gothic:'尖拱与结构切角',chinese:'飞檐与交领笔势',classic:'对称与克制收束',navy:'舷窗与航海线条',country:'围裙与自然曲线',victorian:'层叠拱形与金边'}[s]}</span></p>${phone('review',s,dark,true)}</div>`).join('')}if(board==='reuse')html=['ready','picker'].map(p=>plate(p,skin,dark)).join('');if(board==='states')html=['empty','queued','failed','missing','fee','keyboard'].map(p=>plate(p,skin,dark)).join('');if(board==='adaptive')html=plate('review',skin,dark,true,'narrow large')+plate('keyboard',skin,true,true,'narrow large');document.querySelector('#stage').innerHTML=html;}else document.querySelector('#stage').innerHTML=phone(page,skin,dark,false,large?'large narrow':'');document.querySelectorAll('[data-page=keyboard] .scroll').forEach(el=>el.scrollTop=el.scrollHeight);}
function go(next){if(page==='fuse'&&next==='result'){page='fusion-fee';document.querySelector('#stage').innerHTML=phone('fuse')+'';let current=document.querySelector('.phone');current.insertAdjacentHTML('beforeend',`<div class="modal-shade"><section class="modal" role="dialog" aria-label="确认生成试衣图"><h2>确认加这件腰饰？</h2><div class="comparison"><div>${art('person')}<p>本次穿搭底图</p></div><div>${art('belt',{cls:'checker'})}<p>本次单品参考</p></div></div><p>将发送当前穿搭底图 1 张、已确认单品素材 1 张，以及名称、穿戴位置与补充要求。</p><div class="detail-line"><span>接收方</span><b>当前所选图像服务</b></div><div class="detail-line"><span>本次操作</span><b>1 次生成 · API 单独计费</b></div><p class="muted">不附带原商品照片或原始自拍。人物与原裙纹仍可能重画，结果自动保存到试衣历史。</p><button class="primary" data-final="result">确认发送并生成</button><button class="secondary" data-final="fuse">返回修改</button></section></div>`);return;}page=next;render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='simulate'){page='review';render();return;}if(b.dataset.view){const current=b.closest('.phone');current.insertAdjacentHTML('beforeend',`<div class="modal-shade photo-view"><section class="modal"><h2>完整图片预览</h2>${art(b.dataset.view==='source'?'source':b.dataset.view==='belt'?'belt':'person',{cls:b.dataset.view==='belt'?'checker product':'portrait',worn:b.dataset.view==='worn'})}<button class="secondary" data-close="photo">关闭预览</button></section></div>`);return;}if(b.dataset.close){b.closest('.photo-view').remove();return;}if(b.dataset.final){page=b.dataset.final;render();return;}if(b.dataset.go){if(b.dataset.go==='fuse'&&page==='review'&&!checks)return;go(b.dataset.go);}if(b.dataset.bg){let a=b.closest('.phone').querySelector('.art.checker');a.classList.toggle('dark-checker',b.dataset.bg==='dark');b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}if(b.id==='large'){large=!large;render();}});
document.addEventListener('change',e=>{if(e.target.id==='skin'){skin=e.target.value;render()}if(e.target.id==='appearance'){dark=e.target.value==='dark';render()}if(e.target.id==='page'){page=e.target.value;render()}if(e.target.matches('[data-base]')){e.target.closest('.phone').querySelector('.footer .primary').disabled=!e.target.checked;}if(e.target.matches('[data-check]')){let phone=e.target.closest('.phone');checks=[...phone.querySelectorAll('[data-check]')].every(x=>x.checked);phone.querySelector('.footer .primary').disabled=!checks;}});
render();
</script>
</body>
</html>
