const q=new URLSearchParams(location.search);if(q.has('small'))document.body.classList.add('small');
function phone(i,old=false){let s=skins[i],c=q.has('dark')?darks[i]:s.slice(2,8);return `<div class="skin ${old?'old':''}"><div class="caption">${s[1]} · ${old?'上一版':'调整后'} · ${q.has('dark')?'暗色':'浅色'}</div><article class="phone" style="--bg:${c[0]};--paper:${c[1]};--ink:${c[2]};--muted:${c[3]};--accent:${c[4]};--line:${c[5]};--radius:${s[8]};--heading:${s[9]};--on:${q.has('dark')?'#29212b':'#fff'}"><div class="bar"><span>‹</span><b>个人</b><span>　</span></div><div class="body"><div class="card"><div class="entry"><span class="symbol">▦</span><strong>实验室</strong><span>›</span></div><p class="desc">展示图、虚拟试衣、识图与 API 配置</p></div><div class="card"><div class="row"><span>▧</span>属性管理</div><div class="row"><span>▤</span>数据备份与恢复</div></div><div class="divider"></div><div class="bar"><span>‹</span><b>实验室</b><span>　</span></div><div class="card"><div class="feature">批量生成展示图</div><p class="desc">一次选择1～30件，统一整理、集中核对。</p><div class="button">选择物品</div></div><div class="card"><div class="section">展示与试衣</div><div class="row">虚拟试衣</div><div class="row">我的模特</div></div></div></article></div>`}
