function phone(p,skin,large=false){const idx=['select','queue','front','layers','fusion','fee'].indexOf(p);const buttons=['核对4件输入与费用','核对已返回结果','核对6件分层输入与费用','确认并保存4份素材','核对4次试衣输入与费用','确认本批发送并分层'];return `<div class="plate${large?' large':''}"><p class="plate-caption">${titles[idx]} · ${names[skins.indexOf(skin)]}</p><article class="phone${dark?' dark':''}" data-skin="${skin}" style="${large?'width:320px':''}"><div class="status">09:41 <span>● ▰</span></div><div class="top"><button class="back">‹</button><strong>${titles[idx]}</strong><button class="more">⋯</button></div><div class="scroll"><div class="workflow">${stages.map((s,i)=>`<span class="${i===({select:0,queue:1,front:1,layers:2,fee:2}[p]??3)?'active':''}">${s}</span>`).join('')}</div>${content(p)}</div><div class="footer"><p class="muted">${p==='layers'?'本地批量保存不计费；原图片继续保留。':'按批次确认，离页后队列继续处理。'}</p><button class="primary">${buttons[idx]}</button><div class="homebar"></div></div></article></div>`}
let pages=params.get('board')==='skins'?skins.map(s=>phone('layers',s)):params.get('board')==='small'?[phone('select','default',true),phone('fee','default',true)]:['select','queue','front','layers','fee'].map(p=>phone(p,'default'));document.getElementById('stage').innerHTML=pages.join('');
