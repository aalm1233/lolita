const q=new URLSearchParams(location.search),skins=['default','gothic','chinese','classic','navy','country','victorian'],names=['甜美','哥特','中华','古典','海军','田园','维多利亚'];

function content(mode){if(mode==='stop')return section('停止后续 6 个排队任务？',`<p>仅停止本次选中的排队任务，当前正在生成的任务继续处理。</p><p class="muted" style="margin-top:12px">确认时已开始的任务会跳过；本操作不会发起新请求。已发送的请求可能仍会计费。</p><button class="primary queue-button">确认停止后续</button><button class="secondary queue-button">继续等待</button>`);if(mode==='discard')return section('批量舍弃待确认结果',`<p class="muted">已选择 2 / 3 项。仅移除未保存预览，保留原图、已保存素材和任务记录。</p><button class="secondary queue-button">全选待确认项</button>${['蕾丝领衬衫 · 主视图','黑色系带靴 · 透明层','我的个人模特'].map((x,i)=>`<div class="check-row"><span class="check">${i<2?'☑':'☐'}</span><div class="thumb-art">${i===1?'♧':'♙'}</div><div class="grow">${x}<p class="muted">点击图片放大核对</p></div></div>`).join('')}<button class="primary queue-button">舍弃已选 2 项</button><button class="secondary queue-button">返回核对</button>`);return `<div class="workflow"><span class="active">全部</span><span>进行中</span><span>待处理</span><span>已结束</span></div>`+section('队列管理',`<p>6 个排队 · 1 个执行中 · 3 个待确认</p><button class="secondary queue-button">停止后续 6 个排队任务</button><button class="secondary queue-button">批量舍弃待确认结果</button><p class="muted" style="margin-top:10px">正在处理的任务继续；原图与已保存结果保留。</p>`)+section('秋日服饰展示图',`<p class="muted">4 件物品 · 2 个排队 · 2 个待核对</p><button class="secondary queue-button">打开本批任务流</button>`)+section('蕾丝领衬衫 · 展示图',`<p class="kicker">生成中</p><p class="muted">已等待 32 秒</p><button class="secondary queue-button">查看任务</button>`)}
function phone(s,mode,small=false){return `<div class="plate" style="width:${small?320:390}px;flex-basis:${small?320:390}px"><p class="plate-caption">${names[skins.indexOf(s)]} · ${q.has('dark')?'暗色':'浅色'} · ${mode==='queue'?'任务中心 / 本批队列':mode==='stop'?'停止确认':'多选舍弃'}${small?' · 320dp 大字':''}</p><article class="phone ${q.has('dark')?'dark':''} ${small?'small':''}" data-skin="${s}"><div class="status">9:41 <span>● ▰</span></div><div class="top">‹ <strong>${mode==='queue'?'任务中心':'操作确认'}</strong></div><div class="scroll">${content(mode)}</div><div class="nav"><span>首页</span><span>搭配</span><span>统计</span><b>个人</b></div></article></div>`}
