function scale(){return `<section class="section"><h2 class="section-title">字号与用途</h2>${[['主功能卡','22 / 30 · 600','type-title'],['页面顶栏','20 / 28 · 600','type-title'],['分区标题','18 / 26 · 600','section-title'],['普通条目','16 / 24 · 500','item-title'],['正文与输入','16 / 24 · 400','body'],['辅助说明','13 / 20 · 400','muted'],['操作按钮','15 / 22 · 500','label'],['元数据／底栏','12 / 18','meta']].map(r=>`<div class="scale-row"><span class="${r[2]}" style="${r[0]==='页面顶栏'?'font-size:20px;line-height:28px':''}">${r[0]}</span><span>${r[1]}</span></div>`).join('')}</section><section class="section"><h2 class="section-title">中英数字混排</h2><p class="body">API 配置与尺码 M / L</p><p class="body" style="margin-top:8px">当前订单实付 ¥12,345.67</p><p class="muted" style="margin-top:8px">装饰字体留给标题，阅读文字保持清楚。</p></section>`}
function form(){return `<section class="section"><h2 class="section-title">服饰资料</h2><p class="muted" style="margin-bottom:12px">填写名称与类型，详细资料可后补。</p><div class="input">蕾丝领衬衫</div><div class="input">示例品牌 / Classic</div><p class="body">已拥有 · 单件</p></section><section class="section"><h2 class="section-title">展示图</h2><p class="explain">确认透明单品图后，可设为封面，也可重复用于试衣。</p><button class="secondary" style="margin-top:12px">生成展示图</button></section>`}
function home(){return `<div style="display:flex;align-items:center;gap:0;margin:-12px -12px 14px;padding:4px 0;background:var(--lol-paper)"><span style="width:32px">⌕</span><div style="display:flex;flex:1;justify-content:space-around;min-width:0">${['位置','服饰','套装','心愿'].map(x=>`<span style="padding:8px 0;font-size:${q.has('large')?24:12}px;line-height:1.5;white-space:nowrap">${x}</span>`).join('')}</div><span style="width:32px;display:flex;flex-direction:column;align-items:center"><span style="font-size:20px;line-height:30px;padding:0 2px;background:var(--lol-paper);border-radius:9px">3</span><span style="font-size:24px;line-height:32px;margin-top:-10px">☷</span></span><span style="width:32px">↕</span><span style="width:32px">▦</span></div><section class="section"><h2 class="section-title">服饰与小物</h2><p class="body">保留四标签与所有原控制的一行布局。收紧标签内边距，让系统大字自然增长。</p></section><section class="section"><p class="item-title">蕾丝领衬衫</p><p class="muted">参考品牌 · 单件 · 已拥有</p></section>`}
function stats(){return `<section class="section"><h2 class="section-title">衣橱概况</h2><div class="sample" style="grid-template-columns:repeat(4,1fr);gap:8px">${[['128','已拥有'],['8','愿望单'],['12','套装'],['32','穿搭记录']].map(r=>`<div style="padding:4px"><b class="type-title reading">${r[0]}</b><p class="muted">${r[1]}</p></div>`).join('')}</div></section><section class="section"><h2 class="section-title">消费概览</h2><p class="explain">当前订单实付</p><p class="type-title reading" style="font-size:32px;line-height:40px;color:var(--lol-accent);margin:6px 0">¥12,345.67</p><p class="muted">当前绑定订单的已录实付</p><div class="detail-line"><span>全部已录实付</span><span>¥15,680.00</span></div><p class="muted">包含归档订单，只累计已保存的真实付款</p><div class="detail-line"><span>订单参考均价</span><span>¥268.50</span></div></section><section class="section"><h2 class="section-title">当前订单实付最高</h2><p class="body">蕾丝长裙</p><p class="type-title reading">¥1,268.50</p></section><section class="section"><h2 class="section-title">品类概况</h2><p class="explain">全部登记148件（含配套小物与心愿）·主件128件</p>${['服装','鞋履','袜装','头饰','假发','首饰','包袋','待确认品类'].map(x=>`<div class="detail-line body"><span>${x}</span><span>18 件 ›</span></div>`).join('')}</section><section class="section"><h2 class="section-title">品牌</h2><p class="body">保留原品牌数量与导航</p></section>`}
function phone(s,mode='lab',small=false,old=false){return `<div class="plate" style="width:${small?320:390}px;flex-basis:${small?320:390}px"><p class="plate-caption">${names[skins.indexOf(s)]} · ${q.has('dark')?'暗色':'浅色'} · ${old?'原层级':mode==='scale'?'统一规格':mode==='form'?'编辑与说明':mode==='stats'?'统计摘要与明细':mode==='home'?'首页同排标签':'统一后'}${small?' · 小屏大字':''}</p><article class="phone ${q.has('dark')?'dark':''} ${small?'small':''} ${old?'old':''}" data-skin="${s}"><div class="status">9:41 <span>● ▰</span></div><div class="top">‹ <strong>${mode==='scale'?'字体规格':mode==='form'?'编辑服饰':mode==='stats'?'统计总览':mode==='home'?'我的衣橱':'实验室'}</strong></div><div class="scroll">${mode==='scale'?scale():mode==='form'?form():mode==='stats'?stats():mode==='home'?home():lab()}</div><div class="nav"><span>首页</span><span>搭配</span><span>统计</span><b>个人</b></div></article></div>`}
document.querySelector('#stage').innerHTML=q.get('board')==='home'?[phone('default','home',true),phone('victorian','home',true)].join(''):q.get('board')==='stats'?skins.map(s=>phone(s,'stats')).join(''):q.get('board')==='skins'?skins.map(s=>phone(s)).join(''):q.get('board')==='small'?[phone('default','lab',true),phone('default','form',true)].join(''):[phone('default','lab',false,true),phone('default'),phone('default','scale'),phone('default','form')].join('');</script></html>
