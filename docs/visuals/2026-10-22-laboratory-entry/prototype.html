<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{font:16px -apple-system,'PingFang SC',sans-serif;margin:0;background:#e9e4df;color:#302a31}h1{margin:20px;font-size:22px}main{display:flex;gap:20px;padding:20px;flex-wrap:wrap}.phone{width:320px;background:var(--bg);color:var(--ink);padding:16px;border-radius:20px}h2{font-size:18px;margin:0 0 18px}article{display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:12px;background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:16px}.featured{box-shadow:0 3px 10px #0001}.badge{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round} .copy{flex:1;min-width:0}.title{font-size:16px;line-height:24px;font-weight:500}.desc{font-size:13px;line-height:20px;opacity:.78}.chevron{font-size:18px;opacity:.6}.caption{font-size:12px;line-height:20px;margin-bottom:14px}body.small article{align-items:center}body.small .title{font-size:32px;line-height:48px}body.small .desc{font-size:26px;line-height:40px}.spec{width:100%;padding:12px 20px;line-height:24px;font-size:14px}</style><h1>个人页实验室：统一文字轴线与专属烧瓶图标</h1><div class="spec">实现前设计 · 图标 40dp 底座／22dp 画幅 · 12dp 图文间隔 · 卡片内边距与其他入口共用 · 标题与说明同列<br>所有标题与说明左边缘一致；FEATURED 仅保留既有边框与阴影。示意图非 Compose 验收。</div><main id="main"></main><script>const colors=[["default", "甜美", "#fff1f8", "#ffffff", "#ee67b0", "#2b2430"], ["gothic", "哥特", "#1e172b", "#34273f", "#b78bdc", "#f1e7f6"], ["chinese", "中华", "#fff8ee", "#fffdf5", "#bd2948", "#392c2b"], ["classic", "古典", "#f7f1eb", "#fffaf4", "#9d6470", "#3d3032"], ["navy", "海军", "#eef7ff", "#f8fbff", "#438dc3", "#24374a"], ["country", "田园", "#f4f2e6", "#fffef4", "#839e64", "#34412e"], ["victorian", "维多利亚", "#fbf3e5", "#fff9ec", "#8d2945", "#3c2c2d"]],paths={"default": "M9 3H15 M10 3V8C10 10 5 12 5 17C5 21 8 22 12 22C16 22 19 21 19 17C19 12 14 10 14 8V3 M6 16C9 14 14 18 18 16", "gothic": "M9 3H15 M10 3V9L4 18L7 22H17L20 18L14 9V3 M7 16H17 M10 19H14", "chinese": "M9 3H15 M10 3V7C6 8 7 12 10 12C3 15 5 22 12 22C19 22 21 15 14 12C17 12 18 8 14 7V3 M7 17C10 16 14 18 17 17", "classic": "M9 3H15 M10 3V11C6 12 5 15 6 18C7 21 9 22 12 22C15 22 17 21 18 18C19 15 18 12 14 11V3 M6 16H18", "navy": "M8 3H16 M9 3V9L5 13V19L8 22H16L19 19V13L15 9V3 M5 15C8 13 11 17 14 15C16 14 17 14 19 15 M10 19H14", "country": "M8 4Q12 2 16 4 M9 4V9Q4 10 4 16Q4 22 12 22Q20 22 20 16Q20 10 15 9V4 M4 16Q8 13 12 16Q16 19 20 16", "victorian": "M8 3H16 M10 3V10C10 13 7 13 7 17C7 20 9 21 12 21C15 21 17 20 17 17C17 13 14 13 14 10V3 M9 22H15 M8 16Q12 18 16 16"};let q=new URLSearchParams(location.search);let dark=q.has('dark');document.body.classList.toggle('small',q.has('small'));let rows=q.has('small')?[colors[0],colors[6]]:colors;for(let [id,name,bg,card,accent,ink]of rows){if(dark){bg='#1d1921';card='#302a34';ink='#f2eaf4';accent=id==='navy'?'#85b8df':id==='country'?'#b5c994':id==='gothic'?'#c49be4':'#e4a1b3'}let icon=`<svg viewBox="0 0 24 24"><path d="${paths[id]}"/></svg>`;let other='<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>';let row=(title,desc,img,featured='')=>`<article class="${featured}"><span class="badge">${img}</span><div class="copy"><div class="title">${title}</div><div class="desc">${desc}</div></div><span class="chevron">›</span></article>`;main.innerHTML+=`<section class="phone" style="--bg:${bg};--card:${card};--accent:${accent};--ink:${ink}"><h2>${name} · ${dark?'暗色':'浅色'}</h2><div class="caption">共用文字轴线，与下方同级入口对齐</div>${row('实验室','展示图、试衣与识图',icon,'featured')}${row('属性管理','品牌、类型与收纳等',other)}${row('数据备份与恢复','使用 ZIP 备份记录和图片',other)}</section>`}</script>
