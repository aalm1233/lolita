<style>*{box-sizing:border-box}body{margin:24px;background:#ece8e6;color:#332e32;font:14px/1.5 -apple-system,'Hiragino Sans GB',sans-serif}h1{font-size:24px;margin:0}p{margin:8px 0 18px}.board{display:flex;gap:18px}.skin{width:310px;flex:none}.caption{margin:12px 0 8px;font-weight:600}.phone{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:22px;min-height:660px}.bar{padding:16px;background:var(--paper);font-size:18px;line-height:26px;display:flex;justify-content:space-between;font-weight:500}.body{padding:16px}.card{padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);margin-bottom:16px}.section{font-size:18px;line-height:26px;font-weight:600;border-left:3px solid var(--accent);padding-left:8px;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px;font-size:16px;line-height:24px}.row:last-child{border:0}.meta{font-size:13px;line-height:20px;color:var(--muted);margin:6px 0}.amount{font-size:28px;font-weight:600;line-height:36px;color:var(--accent);margin:8px 0}.button{border-radius:14px;text-align:center;background:var(--accent);color:var(--on);font-size:15px;line-height:22px;padding:11px 10px;margin-top:14px;font-weight:500}.outline{background:transparent;color:var(--accent);border:1px solid var(--line)}.photo{height:170px;background:linear-gradient(45deg,#d7cbc455,#faf8f144);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.tag{font-size:12px;line-height:18px;color:var(--accent)}.tabs{display:flex;justify-content:space-between;padding:14px 12px;font-size:14px}.field{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;font-size:16px}.warning{font-size:14px;line-height:22px;color:var(--accent);padding:12px;border-left:3px solid var(--accent);background:var(--paper)}.fold{color:var(--accent);font-size:14px;line-height:22px;padding-top:12px}.small .skin{width:320px}.small .phone{min-height:860px}.small .row,.small .field{font-size:28px;line-height:42px}.small .bar,.small .section{font-size:32px;line-height:46px}.small .meta,.small .fold{font-size:24px;line-height:36px}.small .button{font-size:26px;line-height:38px}.small .warning{font-size:24px;line-height:36px}</style>
<h1>减少解释重复，让当前内容与操作先被看到</h1><p>保留图片、当前状态与主要操作；技术解释按需展开，费用、未知金额和删除后果明确可见。实现前原创界面图。</p><main class="board"></main><script>const skins=[['default','甜美','#fff0f5','#fff','#424242','#75626c','#f54d9b','#ead5df','16px','sans-serif','#fff'],['gothic','哥特','#f5f0f5','#fff','#2c2032','#746679','#742c87','#d5c3d8','8px','serif','#fff'],['chinese','中华','#fff8f0','#fffdf5','#382a26','#7e625a','#c41e3a','#e1c9b7','4px','ChineseHeading,serif','#fff'],['classic','古典','#faf5f0','#fff8f5','#3e2723','#78676c','#722f37','#ddcbbb','12px','serif','#fff'],['navy','海军','#f0f8ff','#f5faff','#24384c','#62788e','#245f9f','#c8dbea','14px','sans-serif','#fff'],['country','田园','#f9f4e8','#fffcf7','#31281f','#787265','#526e42','#d9dccb','20px','serif','#fff'],['victorian','维多利亚','#fff8f0','#fff5e6','#3e2723','#80685d','#7b1e3a','#c9aa69','12px','serif','#fff']];
const darks=[['#212121','#424242','#f5f5f5','#d1c7cf','#ff8ec5','#705a66'],['#1a1a2e','#2d2d44','#eee7f4','#cbbad7','#d4a1e8','#79627d'],['#1a1410','#2d2520','#e0d8d0','#c9bcb2','#ff9092','#846354'],['#1a1515','#2d2525','#e0d8d0','#cabdb8','#e5a9b3','#806b5d'],['#0d1b2a','#1b2d44','#d0e0f0','#b7cbdc','#90c6ff','#476782'],['#1f261c','#2d3529','#e5dfd3','#c7cbbb','#b7d3a2','#65745a'],['#1a1210','#2c1e18','#f5e6d3','#cebcaf','#efa8b6','#947742']];

const q=new URLSearchParams(location.search),dark=q.has('dark');if(q.has('small'))document.body.classList.add('small');
const garment=`<svg width="110" height="156" viewBox="0 0 110 156"><path d="M37 9L48 18H62L73 9 81 48 70 55 96 145Q55 154 14 145L40 55 29 48Z" fill="currentColor" opacity=".75"/><path d="M39 60H71M28 103H82M21 127H89" stroke="white" stroke-width="4" opacity=".7"/></svg>`;
function phone(title,body,bottom=''){return `<article class="phone"><header class="bar"><span>‹</span><span>${title}</span><span>···</span></header><div class="body">${body}</div>${bottom?`<div class="body">${bottom}</div>`:''}</article>`}
function card(title,content){return `<section class="card"><div class="section">${title}</div>${content}</section>`}
function btn(s,outline=false){return `<div class="button ${outline?'outline':''}">${s}</div>`}
const screens=[
['首页与详情',phone('首页',`<div class="tabs">位置　服饰　套装　心愿</div><div class="card"><div class="row"><div>今日穿搭<div class="meta">尚未记录</div></div><span>记录 ›</span></div></div><div class="card"><div class="row"><span>卧室</span><span>12 条记录 ›</span></div></div><div class="card"><div class="row"><span>客厅</span><span>0 条记录 ›</span></div></div>`)],
['物品详情',phone('物品详情',`<div class="photo">${garment}</div><div class="row"><span>玫瑰花园 JSK</span><span class="tag">已拥有</span></div>${card('价格与付款','<div class="amount">实付 ¥680.00</div><div class="row"><span>待付 ¥0.00</span><span>查看 ›</span></div>')}${card('基本信息','<div class="row"><span>品牌</span><span>已登记品牌</span></div><div class="row"><span>类型</span><span>JSK</span></div>')}${card('订单明细','<div class="fold">展开　⌄</div>')}${card('记录信息','<div class="fold">展开　⌄</div>')}`)],
['备份与恢复',phone('数据备份与恢复',`${card('完整备份 · ZIP','<div class="meta">包含记录和图片，推荐使用</div>'+btn('导出完整备份'))}${card('数据备份 · JSON','<div class="meta">不含图片；完整备份请选择 ZIP</div>'+btn('导出数据备份',true))}${card('表格导出 · CSV','<div class="meta">供表格查看，不用于恢复</div>'+btn('导出表格',true))}`)],
['恢复确认',phone('恢复备份',`<div class="warning">恢复成功后，当前记录将替换为备份内容。</div>${card('备份内容','<div class="meta">2026年10月22日</div><div class="row"><span>物品</span><span>140 件</span></div><div class="row"><span>图片</span><span>190 张</span></div><div class="fold">查看全部明细　⌄</div>')}<div class="warning">付款资料仍有待核对项，恢复后请继续补全。</div>`,btn('确认恢复')+btn('取消',true))],
['试衣与费用',phone('虚拟试衣',`${card('本次试衣人物','<div class="photo">已确认人物预览</div><div class="row"><span>我的模特</span><span>更换 ›</span></div>')}${card('试衣单品','<div class="meta">搭配 3 件 · 本次 3 件</div><div class="row"><span>玫瑰花园 JSK</span><span>主件 ›</span></div>')}<div class="field">补充穿戴要求</div><div class="meta">仅供效果参考，不能判断真实尺码。</div><div class="fold">效果说明　⌄</div>`, '<div class="meta">将发送 4 张图片至火山方舟，另行计费</div>'+btn('生成试衣图'))],
['发送前确认',phone('发送前确认',`${card('费用与结果','<div class="row"><span>接收服务</span><span>即梦 / 火山方舟</span></div><div class="row"><span>请求数量</span><span>3 次</span></div><div class="meta">每件生成一张主视图，返回后另行确认分层费用。</div>')}${card('将发送的图片','<div class="photo">${garment}</div><div class="meta">已核对全部 3 件实际图片</div>')}<div class="warning">按服务实际资费计费。取消或超时后仍可能计费，不自动重试。</div>`,btn('确认发送（3 次请求）')+btn('返回修改',true))],
['任务中心',phone('任务中心',`${btn('新建展示图批次',true)}<div class="tabs">全部　进行中　待确认　已结束</div>${card('秋日展示图','<div class="meta">4 件 · 2 个执行中 · 2 个待确认</div><div class="row"><span>查看批次</span><span>›</span></div>')}${card('我的模特','<div class="photo">待确认图片</div><div class="row"><span>待确认</span><span>查看结果 ›</span></div>')}<div class="fold">后台与息屏说明　›</div>`)],
['关键状态',phone('状态与必要提示',`<div class="warning">未付余额未知，付款资料待核对。</div>${card('心愿参考总价','<div class="amount">¥1,280.00</div><div class="fold">统计口径　⌄</div>')}${card('已拥有占比','<div class="row"><span>已拥有 / 已拥有与心愿合计</span><span>12 / 18</span></div>')}${card('放弃未保存的修改？','<div class="meta">返回后，本次未保存的修改将丢失。</div>'+btn('放弃并返回')+btn('继续编辑',true))}`)]
];
function skin(i){const s=skins[i],c=dark?darks[i]:s.slice(2,8);return `<div class="skin" style="--bg:${c[0]};--paper:${c[1]};--ink:${c[2]};--muted:${c[3]};--accent:${c[4]};--line:${c[5]};--radius:${s[8]};--on:${dark?'#29212b':'#fff'}"><div class="caption">${s[1]} · ${dark?'暗色':'浅色'}</div>${screens.map(([name,view])=>`<div class="caption">${name}</div>${view}`).join('')}</div>`}
document.querySelector('main').innerHTML=(q.has('small')?[0,2]:q.has('flow')?[0]:skins.map((_,i)=>i)).map(skin).join('');</script>
