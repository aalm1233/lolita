<!doctype html><html lang="zh"><meta charset="utf-8"><title>广场 · 本地资料包导入前置设计</title><style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#e7e3df;font:16px/1.55 -apple-system,'PingFang SC',sans-serif;color:#403834}h1{font-size:28px;margin:0 0 8px}p{margin:6px 0 20px}.grid{display:flex;gap:22px;flex-wrap:wrap}.phone{width:340px;height:690px;border:7px solid #292627;border-radius:35px;overflow:hidden;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}.top{padding:24px 20px 14px;background:var(--accent);color:white;font-size:18px;text-align:center}.body{padding:20px;flex:1;overflow:hidden}.card{border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;background:var(--card)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent)}h2{font:600 22px/1.4 Georgia,'Songti SC',serif;margin:12px 0}h3{font-size:18px;margin:0 0 8px}.muted{opacity:.72;font-size:14px}button{border:0;border-radius:12px;background:var(--accent);color:white;font:500 15px/1.5 inherit;padding:13px;width:100%;margin-top:16px}.secondary{background:transparent;border:1px solid var(--line);color:var(--fg)}.nav{padding:14px 8px;border-top:1px solid var(--line);font-size:12px;display:flex;justify-content:space-around}.nav b{color:var(--accent)}.art{height:130px;display:grid;place-items:center}.art svg{width:120px;stroke:var(--accent);fill:none;stroke-width:2}.row{display:flex;justify-content:space-between;margin:12px 0}.progress{height:5px;background:var(--line);margin:22px 0}.progress i{display:block;width:55%;height:100%;background:var(--accent)}.label{font-size:13px;margin:12px 0;color:#5b5149}.skin .phone{width:250px;height:560px}.skin .body{padding:14px}.skin h2{font-size:19px}.skin .card{padding:14px}.skin .art{height:80px}.skin .art svg{width:80px}
</style><h1>广场 · 把店铺资料带进来</h1><p>本地导入第一版 / 艺术图稿，先于原生实现 / 2026-11-05</p><div class="grid" id="flow"></div><h1 style="margin-top:40px">七套皮肤 · 浅色与深色</h1><div class="grid skin" id="skins"></div><script>
const palettes=[['甜美','#f8edf1','#fffafd','#a45979','#47353f'],['哥特','#ede8ef','#faf6fc','#684878','#35263e'],['中华','#f8efdf','#fffcf4','#9c5547','#513d31'],['古典','#f3ebdf','#fffaf1','#8a684d','#4d4033'],['海军','#e6eff3','#f7fbff','#365c77','#263e51'],['田园','#edf1e5','#fcfdf7','#62794c','#394832'],['维多利亚','#f1e6df','#fff8f2','#8a5665','#513a3a']];
const art='<div class="art"><svg viewBox="0 0 120 100"><path d="M20 85V28h80v57M15 28l10-16h70l10 16M15 30h90M31 30v55m58-55v55M46 85V57q14-23 28 0v28M50 19h20M12 88h96"/><path d="M45 42h30m-7-6 7 6-7 6"/></svg></div>';
function phone(name,mode,body,index=3){let p=palettes[index];let dark=mode==='暗';return `<section><div class="label">${name} · ${mode}</div><div class="phone" style="--bg:${dark?'#242226':p[1]};--card:${dark?'#312d33':p[2]};--accent:${dark?['#db9db8','#bc9bd1','#e7ae8b','#ceb08c','#91bed9','#b1c393','#d6a4b0'][index]:p[3]};--fg:${dark?'#f2e7e0':p[4]};--line:${dark?'#51494f':'#dacec2'}"><div class="top">广场</div><div class="body">${body}</div><div class="nav"><span>首页</span><b>广场</b><span>穿搭</span><span>统计</span><span>个人</span></div></div></section>`}
const empty=art+'<div class="eyebrow">SHOP JOURNAL</div><h2>喜欢的店铺，慢慢看</h2><p class="muted">导入一份广场资料包，查看上新、再贩、现货与尾款。</p><button>导入本地资料包</button><p class="muted">仅添加店铺资料。选择商品后，再登记到心愿。</p>';
const preview='<div class="eyebrow">资料核对</div><h2>三家店的第一份记录</h2><div class="card"><h3>三店资料 · 2026.11.05</h3><div class="row"><span>店铺</span><b>3 家</b></div><div class="row"><span>动态 / 商品链接</span><b>10 / 14</b></div><div class="row"><span>完整规格</span><b>542 个</b></div><p class="muted">古典玩偶 · 莉莉子 · 新路德维希</p></div><p>采集于 11月3日—11月5日。库存与价格为采集时快照。</p><p class="muted">同一标识按版本更新，未出现的资料继续保留。衣橱不受影响。</p><button>导入到广场</button><button class="secondary">取消</button>';
const progress=art+'<h2>正在核验原图</h2><p class="muted">逐张检查文件与校验值，通过后一次更新广场。</p><div class="progress"><i></i></div><p>正在处理图片文件…</p><div class="card">退出或失败不会覆盖旧资料。</div>';
const result=art+'<h2>资料已带到广场</h2><p>3 家店 · 10 条动态 · 542 个完整规格</p><div class="card"><h3>接下来，慢慢挑</h3><p class="muted">先选款式、颜色与尺码，再核对类型。默认登记为心愿，尾款页只供查看。</p></div><button>开始浏览</button>';
const error=art+'<h2>这份资料包未能导入</h2><div class="card">有图片校验不通过。请重新获取完整资料包后再选择。</div><p class="muted">原有广场资料、衣橱与照片均保留。</p><button>重新选择资料包</button>';
document.querySelector('#flow').innerHTML=[empty,preview,progress,result,error].map((b,i)=>phone(['首次进入','导入预览','校验中','成功','失败'][i],'浅',b)).join('');document.querySelector('#skins').innerHTML=palettes.flatMap((p,i)=>['浅','暗'].map(mode=>phone(p[0],mode,empty,i))).join('');
</script></html>
