<!doctype html><meta charset="utf-8"><title>广场 · 淘宝查看 · 前置界面图</title>
<link rel="stylesheet" href="../../2026-11-06-square-browse-first/artist/skin-palette.css"><link rel="stylesheet" href="../../2026-11-06-square-browse-first/artist/style.css">
<style>.board{gap:20px}.secondary{display:flex;gap:10px;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--accent);border-radius:var(--radius);color:var(--accent);padding:10px 16px;font-size:calc(15px * var(--scale));width:100%;margin:12px 0}.large{width:320px;--scale:2}.phone .hero{height:260px}.modal{position:absolute;inset:0;display:flex;align-items:center;background:#0006;padding:24px}.dialog{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;max-height:85%;overflow:auto}.dialog h3{font-size:calc(18px * var(--scale));font-weight:600}.source-link{display:block;width:100%;padding:14px 0;text-align:left;border-bottom:1px solid var(--line);font-size:calc(16px * var(--scale))}.source-link small{font-size:calc(13px * var(--scale));color:var(--muted);display:block}.failure{position:absolute;bottom:80px;left:12px;right:12px;background:var(--ink);color:var(--bg);padding:14px;border-radius:12px;font-size:calc(14px * var(--scale))}.failure button{display:block;color:var(--bg);text-decoration:underline;margin-top:6px}.disabled{opacity:.45}.phone .parts{flex:none}.phone .content{padding:14px 16px}.label{white-space:normal}</style>
<header class="review"><div><small>LOLITA / 前置艺术界面图 · 2026-11-06</small><h1>广场商品 · 淘宝查看</h1><p>商品摘要内次级入口 · 外跳后返回保留浏览上下文 · 图为设计，非原生验收</p></div></header><div id="root" class="board"></div>
<script>
const skins=[['sweet','甜美'],['gothic','哥特'],['chinese','中华'],['classic','古典'],['navy','海军'],['country','田园'],['victorian','维多利亚']];
const q=new URLSearchParams(location.search),board=q.get('board')||'light';
function add(skin,name,mode,state='normal',large=false){const el=document.createElement('section');el.className='panel';const tail=state==='tail';el.innerHTML=`<div class="label"><b>${name} / ${mode==='dark'?'暗色':'浅色'} / ${state}${large?' / 320dp两倍字':''}</b><span>设计稿</span></div><div class="phone ${large?'large':''}" data-skin="${skin}" data-mode="${mode}"><div class="status"><span>09:41</span><span>◔ ▰</span></div><header class="topbar"><button>‹</button><h2>商品详情</h2><span style="width:36px"></span></header><main class="page"><div class="hero"><img src="../../2026-11-06-square-browse-first/artist/assets/${tail?'neo-tail-1.jpg':'dress.webp'}"></div>${tail?'':'<div class="parts"><button class="part active">JSK</button><button class="part">KC</button><button class="part">内搭</button></div>'}<div class="content"><p class="shop">${tail?'新路德维希':'古典玩偶'}</p><h3 class="product-title">${tail?'Lady70 · 本批尾款':'漫游序章 · JSK'}</h3><p class="brief">${tail?'尾款 · 补款中':'上新 · 预售'}</p><div class="intro-price"><strong>${tail?'¥222.00':'¥899.00'}</strong><span>${tail?'尾款':'全款'}</span></div><button class="secondary ${state==='missing'?'disabled':''}">${state==='missing'?'暂无淘宝链接':'淘宝查看　↗'}</button>${tail?'':`<div class="choice"><div class="choice-label">颜色</div><div class="chips"><button class="chip">暂不选</button><button class="chip active">蓝色</button><button class="chip">黑色</button></div></div><div class="choice"><div class="choice-label">尺码</div><div class="chips"><button class="chip active">暂不选</button><button class="chip">S</button><button class="chip">M</button><button class="chip">L</button></div></div>`}<div class="snapshot-row">2026-11-06 · 采集快照　ⓘ</div><div class="section"><div class="section-head"><span>参数</span></div><div class="facts">面料<p>KOKKA 定制印花竹节棉布</p></div></div></div></main>${tail?'':'<footer class="dock"><button>选多件</button><button class="primary">加入心愿</button></footer>'}${state==='multiple'?'<div class="modal"><div class="dialog"><h3>选择商品链接</h3><button class="source-link">漫游序章 · JSK<small>全款　↗</small></button><button class="source-link">漫游序章 · JSK 定金<small>定金　↗</small></button><button class="link">取消</button></div></div>':''}${state==='failure'?'<div class="failure">无法打开淘宝，请复制链接后重试<button>复制链接</button></div>':''}</div>`;document.querySelector('#root').append(el)}
if(['light','dark'].includes(board))for(const [s,n] of skins)add(s,n,board);else for(const [state,large]of [['normal',false],['multiple',false],['tail',false],['missing',false],['failure',true],['multiple',true]])add('classic','古典',large?'dark':'light',state,large);
</script>
