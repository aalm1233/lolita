<!doctype html><meta charset="utf-8"><title>广场 · 浏览修整设计 2026-11-10</title><link rel="stylesheet" href="skin-palette.css"><style>
*{box-sizing:border-box}body{margin:0;background:#e9e5e1;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;padding:28px}h1{font-size:24px;margin:0 0 6px}p{color:#655b55;margin:0 0 22px}.board{display:flex;gap:24px;align-items:start}.label{font-size:14px;margin-bottom:8px;font-weight:600}.phone{height:844px!important;width:390px!important;border-radius:24px!important;flex-shrink:0;font-size:15px!important}.bar{height:74px;padding:30px 18px 12px;display:flex;justify-content:space-between;background:var(--soft);font-size:20px;font-weight:600}.body{padding:14px;overflow:hidden;flex:1}.muted{color:var(--muted);font-size:12px}.title{font-size:22px;font-weight:600;line-height:1.4;margin:8px 0}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.chip{padding:7px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;background:var(--surface)}.selected{background:var(--soft);color:var(--accent);border-color:var(--accent)}.search{padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);color:var(--muted);background:var(--surface)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}.card img{width:100%;height:208px;object-fit:contain;background:var(--surface)}.copy{padding:10px;line-height:1.5}.price{font-size:19px;color:var(--accent);font-weight:600;margin:5px 0}.nav{padding:10px 12px 22px;display:flex;justify-content:space-around;background:var(--surface);color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.hero{position:relative;background:var(--surface);height:274px;border-bottom:1px solid var(--line)}.hero img{width:100%;height:100%;object-fit:contain}.badge{position:absolute;left:14px;top:12px;background:var(--surface);padding:5px 10px;border-radius:var(--radius);font-size:12px;color:var(--accent);border:1px solid var(--line)}.section{margin-top:16px;background:var(--surface);padding:14px;border-radius:var(--radius);border:1px solid var(--line)}.section b{display:block;border-left:3px solid var(--accent);padding-left:8px;margin-bottom:12px}.dock{padding:12px 14px 22px;background:var(--surface);display:flex;gap:10px}.sheet>.button{flex:0 0 auto}.button{background:var(--button);color:var(--on-button);border-radius:var(--radius);padding:12px;text-align:center;flex:1;font-size:15px}.secondary{background:transparent;color:var(--accent);border:1px solid var(--line);flex:0 0 90px}.divider{border-top:1px solid var(--line);margin:12px 0}.item img{height:116px;width:100%;object-fit:contain}.item{text-align:center;padding:8px}.sheet{background:var(--surface);height:680px;margin-top:40px;border-radius:24px 24px 0 0;padding:18px;display:flex;flex-direction:column}.handle{width:34px;height:4px;background:var(--line);margin:0 auto 16px}.scroll{flex:1;overflow:hidden}.hint{font-size:12px;color:var(--muted);line-height:1.5}.skinlabel{position:absolute;right:12px;top:12px;font-size:10px}.small{font-size:12px}.link{color:var(--accent);font-size:13px}
</style><h1>广场 · 从浏览到心愿</h1><p>修复顺序 5 → 6 → 1 → 4 → 2 → 3 ｜ 普通字号、Pixel 7 ｜ 前置设计图，非原生截图</p><div class="board" id="board"></div><script>
const nav='<div class="nav"><span>♧ 衣橱</span><span>♧ 穿搭</span><span style="color:var(--accent)">⌂ 广场</span><span>♧ 个人</span></div>';
const card=(img,title,price)=>`<div class="card"><img src="assets/${img}"><div class="copy"><div class="muted">古典玩偶</div><strong>${title}</strong><div class="price">${price}</div><div class="muted">上新 · 定金</div></div></div>`;
const screens={feed:`<div class="bar">广场 <span>⚙</span></div><div class="body"><div class="search">⌕ 搜索商品或店铺</div><div class="chips"><span class="chip selected">全部</span><span class="chip">上新</span><span class="chip">再贩</span><span class="chip">现货</span><span class="chip">尾款</span></div><div class="row between"><span>全部店铺⌄</span><span class="link">筛选</span></div><div class="grid" style="margin-top:12px">${card('dress.webp','桃乐丝 · JSK','¥100 起')}${card('blouse.webp','桃乐丝 · 姬袖内搭','¥50 起')}${card('kc.webp','桃乐丝 · KC','报价未确认')}${card('black-dress.webp','礼服系列','¥230 起')}</div></div>${nav}`,
detail:`<div class="bar">‹ 商品 <span>⋯</span></div><div class="hero"><img src="assets/dress.webp"></div><div class="body"><div class="chips"><span class="chip selected">JSK</span><span class="chip">姬袖内搭</span><span class="chip">KC</span><span class="chip">全部单品</span></div><div class="muted">古典玩偶 · 桃乐丝</div><div class="title">JSK</div><div class="row between"><div class="price">¥100 <span class="small">定金</span></div><span class="link">淘宝查看 ↗</span></div><div class="muted">上新 · 日期未知 ⓘ</div><div class="muted" style="margin-top:12px">颜色</div><div class="chips"><span class="chip">暂不选</span><span class="chip selected">蓝色</span><span class="chip">粉色</span></div><div class="muted">尺码 <span class="link" style="float:right">尺码表</span></div><div class="chips"><span class="chip selected">暂不选</span><span class="chip">S</span><span class="chip">M</span><span class="chip">L</span></div><div class="section"><b>参数</b><div>尺码表　S　M　L</div><div class="divider"></div><span class="link">查看完整参数与售卖说明⌄</span></div></div><div class="dock"><div class="button secondary">选多件</div><div class="button">加入心愿</div></div>`,
reference:`<div class="bar">‹ 商品</div><div class="hero"><img src="assets/model.webp"><span class="badge">系列参考图</span></div><div class="body"><div class="hint">未提供对应单品图，参考图不作为心愿封面。</div><div class="chips"><span class="chip selected">JSK</span><span class="chip">姬袖内搭</span><span class="chip">头饰</span></div><div class="muted">古典玩偶 · 桃乐丝</div><div class="title">JSK</div><div class="price">¥100 <span class="small">全款</span></div><div class="muted">再贩 · 日期未知 ⓘ</div><div class="section"><b>参数</b><div>尺码表先呈现</div><div class="divider"></div><span class="link">查看完整参数与售卖说明⌄</span></div></div><div class="dock"><div class="button secondary">选多件</div><div class="button">加入心愿</div></div>`,
parts:`<div class="bar">‹ 商品</div><div class="sheet"><div class="handle"></div><div class="title">全部单品</div><div class="search">⌕ 搜索单品</div><div class="scroll"><div class="grid" style="margin-top:16px"><div class="card item"><img src="assets/kc.webp"><div>经典颈饰</div><div class="muted">4 个颜色</div></div><div class="card item"><img src="assets/kc.webp"><div>SP 颈饰</div><div class="muted">2 个颜色</div></div><div class="card item"><img src="assets/blouse.webp"><div>袖套</div><div class="muted">白粉 / 白蓝</div></div><div class="card item"><img src="assets/set.webp"><div>商家套装</div><div class="muted">保留组合身份</div></div></div><div class="section"><b>经典颈饰 · 颜色</b><div class="chips"><span class="chip selected">白粉</span><span class="chip">白蓝</span><span class="chip">粉色</span><span class="chip">棕色</span></div></div></div><div class="button">完成</div></div>`,
filters:`<div class="bar">广场</div><div class="sheet"><div class="handle"></div><div class="row between"><div class="title">筛选</div><span class="muted">花与珍珠匣 · 上新</span></div><div class="scroll"><b>内容</b><div class="chips"><span class="chip">不限</span><span class="chip">单品</span><span class="chip selected">小物</span><span class="chip">套装</span><span class="chip">组合</span></div><b>颜色</b><div class="search" style="margin-top:10px">⌕ 搜索颜色</div><div class="chips"><span class="chip selected">不限</span><span class="chip">白粉</span><span class="chip">白蓝</span><span class="chip">粉色</span><span class="chip">棕色</span></div><b>风格</b><div class="chips"><span class="chip selected">不限</span><span class="chip">甜美</span><span class="chip">古典</span></div><div class="section"><b>已选</b><span class="chip selected">小物 ×</span></div><div class="hint" style="margin-top:20px">列表封面、默认进入单品与当前筛选一致；清除属性保留店铺、动态类型和搜索。</div></div><div class="row"><div class="button secondary">清除属性</div><div class="button">完成</div></div></div>`};
const q=new URLSearchParams(location.search), mode=q.get('mode')||'light', all=q.has('skins');
const names={sweet:'甜美',gothic:'哥特',chinese:'中华',classic:'古典',navy:'海军',country:'田园',victorian:'维多利亚'};
const views=all?Object.keys(names).map(s=>[s,'detail']):Object.keys(screens).map(s=>['classic',s]);
document.getElementById('board').innerHTML=views.map(([skin,screen])=>`<div><div class="label">${all?names[skin]+' · '+mode:({feed:'5 卡片层级',detail:'6 详情层级',reference:'1 有图可看',parts:'4 单品与颜色',filters:'2→3 筛选衔接'})[screen]}</div><div class="phone" data-skin="${skin}" data-mode="${mode}">${screens[screen]}</div></div>`).join('');
</script>
