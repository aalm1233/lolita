<!doctype html><meta charset="utf-8"><title>广场 · 时间与售卖状态</title><link rel="stylesheet" href="skin-palette.css"><style>*{box-sizing:border-box}body{margin:0;padding:26px;background:#e9e5e1;font-family:-apple-system,'PingFang SC',sans-serif}h1{font-size:24px;margin:0 0 6px}p{color:#6c5d56;margin-bottom:22px}.board{display:flex;gap:20px}.phone{height:844px!important;flex-shrink:0;font-size:15px!important}.label{font-size:14px;margin-bottom:8px}.bar{height:74px;background:var(--soft);padding:30px 16px 10px;display:flex;justify-content:space-between;font-size:20px}.body{padding:14px;flex:1;overflow:hidden}.chips{display:flex;gap:5px;margin:12px 0}.chip{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px}.selected{color:var(--accent);background:var(--soft);border-color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);overflow:hidden;position:relative}.card img{width:100%;height:218px;object-fit:contain}.copy{padding:10px;line-height:1.6}.muted{color:var(--muted);font-size:12px}.badge{position:absolute;left:6px;top:6px;background:var(--surface);color:var(--accent);font-size:12px;padding:4px 8px;border-radius:var(--radius)}.price{color:var(--accent);font-size:17px;font-weight:600;margin:6px 0}.search{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--muted)}.nav,.dock{padding:12px 10px 22px;background:var(--surface);display:flex;justify-content:space-around;border-top:1px solid var(--line);font-size:12px}.section{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;margin-top:14px}.section b{display:block;border-left:3px solid var(--accent);padding-left:8px;margin-bottom:12px}.fact{display:flex;gap:16px;margin:12px 0}.fact span{color:var(--muted);width:80px;flex-shrink:0}.title{font-size:22px;font-weight:600;margin:12px 0}.button{padding:12px;background:var(--button);color:var(--on-button);border-radius:var(--radius);text-align:center;flex:1}.hero{height:265px;background:var(--surface)}.hero img{height:100%;width:100%;object-fit:contain}.date{font-size:12px;color:var(--muted);margin-top:5px}</style><h1>时间有依据，分类看当前</h1><p>前置设计 · 2.78.7 / 163 ｜ 普通 Pixel 7、默认字号 ｜ 不测小屏/大字体</p><div id="board" class="board"></div><script>
const card=(img,badge,title,time)=>`<div class="card"><img src="assets/${img}"><span class="badge">${badge}</span><div class="copy"><div class="muted">${img==='neo.webp'?'新路德维希':'古典玩偶'}</div><strong>${title}</strong><div class="date">${time}</div><div class="price">${img==='neo.webp'?'¥108–1588 · 全款':'¥100 · 定金'}</div></div></div>`;
const feed=`<div class="bar">广场 <span>⚙</span></div><div class="body"><div class="search">⌕ 搜索商品或店铺</div><div class="chips"><span class="chip selected">全部</span><span class="chip">上新</span><span class="chip">再贩</span><span class="chip">现货</span><span class="chip">尾款</span></div><p class="muted">全部店铺⌄ <span style="float:right">筛选</span></p><div class="grid">${card('dress.webp','上新','漫游序章','开售 10月30日 20:00')}${card('neo.webp','现货 · 再贩','吉祥天 2025 再贩 · 掉落','采集 2026-11-09')}${card('blouse.webp','再贩','三团预约','预约 10月17日—11月17日')}${card('kc.webp','尾款','补尾款','补尾 10.25—11.15')}</div></div><div class="nav">衣橱　　穿搭　　广场　　个人</div>`;
const spot=`<div class="bar">广场</div><div class="body"><div class="search">⌕ 吉祥天</div><div class="chips"><span class="chip">全部</span><span class="chip">上新</span><span class="chip">再贩</span><span class="chip selected">现货</span><span class="chip">尾款</span></div><div class="muted">新路德维希⌄</div><div class="grid" style="margin-top:16px">${card('neo.webp','现货 · 再贩','吉祥天 2025 再贩 · 掉落','采集 2026-11-09')}</div><div class="section"><b>状态详情</b><div>当前现货掉落</div><div class="muted" style="margin-top:8px">历史批次：2025再贩</div><div class="muted" style="margin-top:8px">全款预售 · 交期以商家说明为准</div></div></div><div class="nav">衣橱　　穿搭　　广场　　个人</div>`;
const detail=`<div class="bar">‹ 商品详情</div><div class="hero"><img src="assets/dress.webp"></div><div class="body"><div class="muted">古典玩偶 · 漫游序章</div><div class="title">JSK</div><div class="price">¥100 · 定金</div><div>上新 · 开售 10月30日 20:00 ⓘ</div><div class="section"><b>时间依据</b><div class="fact"><span>开售</span><div>10月30日 20:00<div class="muted">图片明文，年份未注明</div></div></div><div class="fact"><span>采集</span><div>2026-11-03</div></div><div class="muted">不将采集时间作为上架时间</div></div><div class="section"><b>其他时间</b><div class="fact"><span>历史预约</span><div>2026.02.16 19:00</div></div><div class="muted">旧预约时间不作为本轮再贩日期</div></div></div><div class="dock"><div class="button">加入心愿</div></div>`;
const q=new URLSearchParams(location.search),skins=['sweet','gothic','chinese','classic','navy','country','victorian'],mode=q.get('mode')||'light';document.getElementById('board').innerHTML=(q.has('skins')?skins.map(s=>[s,feed,s+' / '+mode]):[['classic',feed,'日期与当前分类'],['classic',spot,'现货归类，保留再贩'],['classic',detail,'时间类型与来源']]).map(([s,v,t])=>`<div><div class="label">${t}</div><div class="phone" data-skin="${s}" data-mode="${mode}">${v}</div></div>`).join('');</script>
